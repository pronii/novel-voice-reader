name: ci

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build the iOS unsigned IPA (slow macOS job)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  build-android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      # Caches ~/.gradle so dependency resolution and compile are incremental
      # across runs (biggest win for the Android job).
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
      # Release-only: the debug APK was rarely needed once the release build
      # became installable with the shared signing key, and skipping it cuts
      # the Android job time roughly in half.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    # Only when explicitly requested via the dispatch input, or on tag pushes
    # (store releases). Everyday Android-only dispatches no longer pay the
    # ~10-minute macOS build.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true') || startsWith(github.ref, 'refs/tags/v')
    needs: test-android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          find build/ipa/Payload/Runner.app -path '*/_CodeSignature/*' -delete
          find build/ipa/Payload/Runner.app -type d -name _CodeSignature -delete
          find build/ipa/Payload/Runner.app -type f -name embedded.mobileprovision -delete
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload novel-voice-reader-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ipa/novel-voice-reader-unsigned.ipa
          if-no-files-found: error
